name: dart_nats
description: A Dart client for the NATS messaging system. Design to use with Dart and flutter.
version: 1.6.0
homepage: https://github.com/dart-nats
repository: https://github.com/dart-nats/dart-nats

# Self-signed, test-only key for the in-process fake server used by the
# test/defect regression tests. Not a secret.
false_secrets:
  - /test/certs/server-key.pem

environment:
  sdk: '>=2.15.0 <4.0.0'

# dependencies:

dev_dependencies:
  lints: ^6.1.0
  test: ^1.9.4
  # pedantic: ^1.11.0
dependencies: 
  base32: ^2.1.3
  # cryptography: ^2.0.5
  crypto: ^3.0.7
  ed25519_edwards: ^0.3.1
  meta: ^1.7.0
  web_socket_channel: ^3.0.3
